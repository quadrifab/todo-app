<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">YOUR DAY, ORGANIZED</p>
        <h1>My To-Do List</h1>
        <p class="subtitle">Small steps make big progress.</p>
      </div>
      <button id="theme-button" class="theme-button" type="button">
        🌙 Dark mode
      </button>
    </header>

    <form id="todo-form" class="task-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to get done?"
        autocomplete="off"
        maxlength="120"
        required
      />
      <input id="todo-date" type="date" aria-label="Optional due date" />
      <select id="todo-priority" aria-label="Task priority">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section class="task-panel" aria-label="Tasks">
      <div class="task-toolbar">
        <div>
          <p id="task-count" class="task-count">0 tasks left</p>
          <p id="completed-count" class="completed-count">0 completed</p>
        </div>

        <div class="filters" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all">
            All
          </button>
          <button class="filter-button" type="button" data-filter="active">
            Active
          </button>
          <button class="filter-button" type="button" data-filter="completed">
            Completed
          </button>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>Progress</span>
          <span id="progress-text">0%</span>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Tasks completed"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div class="sort-row">
        <label for="sort-tasks">Sort tasks:</label>
        <select id="sort-tasks">
          <option value="manual">Added order</option>
          <option value="due-date">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>

      <div class="panel-footer">
        <span id="completion-message">You’ve got this!</span>
        <button id="clear-completed" class="text-button" type="button">
          Clear completed
        </button>
      </div>
    </section>

    <p class="tip">Your tasks are saved in this browser on this device.</p>
  </main>
</body>
</html>
